<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DCA-Bot{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0c0f18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DCA Bot">
  <link rel="stylesheet" href="/static/css/app.css?v={{ static_version }}">
  <script src="/static/vendor/chart.js/chart.umd.min.js"></script>
  <script src="/static/vendor/chart.js/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">DCA-Bot</span>
        <span class="brand-version" title="Application version">v{{ app_version }}</span>
      </div>
      <nav class="nav">
        <a href="/dashboard" class="nav-item {% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/performance" class="nav-item {% if page == 'performance' %}active{% endif %}">Performance</a>
        <a href="/transactions" class="nav-item {% if page == 'transactions' %}active{% endif %}">Transactions</a>
        <div class="nav-group {% if page in ('logs', 'alerts', 'audit', 'orders', 'backups') %}open{% endif %}" id="nav-system-group">
          <button type="button" class="nav-group-toggle" id="nav-system-toggle" aria-expanded="{% if page in ('logs', 'alerts', 'audit', 'orders', 'backups') %}true{% else %}false{% endif %}">
            <span>System</span>
            <span class="nav-group-arrow">▸</span>
          </button>
          <div class="nav-group-items">
            <a href="/logs" class="nav-item {% if page == 'logs' %}active{% endif %}">Logs</a>
            <a href="/alerts" class="nav-item {% if page == 'alerts' %}active{% endif %}">Alerts</a>
            <a href="/audit" class="nav-item {% if page == 'audit' %}active{% endif %}">Audit</a>
            <a href="/orders" class="nav-item {% if page == 'orders' %}active{% endif %}">Orders</a>
            <a href="/backups" class="nav-item {% if page == 'backups' %}active{% endif %}">Backups</a>
          </div>
        </div>
        <a href="/preflight" class="nav-item {% if page == 'preflight' %}active{% endif %}">Preflight</a>
        <div class="nav-spacer"></div>
        <a href="/settings" class="nav-item {% if page == 'settings' %}active{% endif %}">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <form action="/logout" method="post" class="logout-form">
          <button type="submit" class="btn btn-small btn-secondary">Logout {{ username }}</button>
        </form>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌓</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">☰</button>
        <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
        <div class="topbar-controls">
          <button class="btn btn-small btn-primary" id="buy-now-btn">Buy Now</button>
          <button class="btn btn-small btn-secondary" id="pause-toggle-btn" data-action="/api/bot/pause">Pause</button>
          <button class="btn btn-small btn-secondary" id="restart-bot-btn" title="Restart the bot (applies saved settings)">Restart</button>
          <button class="btn btn-small btn-secondary" id="live-trading-toggle-btn" title="Toggle live trading">Live: …</button>
        </div>
        <div class="topbar-badges">
          <span id="status-badge" class="badge">—</span>
          <span id="exchange-status" class="badge">—</span>
          <span id="telegram-status" class="badge">—</span>
          <span id="advisor-status" class="badge" style="display:none;">Advisor</span>
          <a href="/alerts" id="warning-badge" class="warning-badge" title="No warnings">
            <span>⚠</span>
          </a>
          <div class="mode-banner" id="mode-banner">
            <span class="mode-badge" id="mode-badge">Loading…</span>
          </div>
        </div>
      </header>
      <div class="update-banner" id="update-banner" hidden>
        <span id="update-banner-text"></span>
        <a id="update-banner-link" class="update-banner-link" target="_blank" rel="noopener noreferrer" hidden>View release</a>
        <button type="button" class="btn btn-small btn-secondary" id="update-banner-dismiss">Dismiss</button>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="modal" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="modal-backdrop" data-confirm-cancel></div>
    <div class="modal-card confirm-card">
      <div class="modal-header"><h2 id="confirm-modal-title">Please confirm</h2></div>
      <p id="confirm-modal-message"></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" data-confirm-cancel>Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-modal-ok">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/static/js/dom-safe.js?v={{ static_version }}"></script>
  <script src="/static/js/app.js?v={{ static_version }}"></script>
  <script>
    (function () {
      const banner = document.getElementById('update-banner');
      if (!banner) return;
      const textEl = document.getElementById('update-banner-text');
      const linkEl = document.getElementById('update-banner-link');
      const dismissBtn = document.getElementById('update-banner-dismiss');
      let currentTag = null;

      function renderBanner(status) {
        if (!status || !status.update_available || !status.latest_version) {
          banner.hidden = true;
          currentTag = null;
          return;
        }
        currentTag = status.latest_version;
        textEl.textContent = 'A new version is available: ' + status.latest_version +
          (status.current_version ? ' (you are running v' + status.current_version + ')' : '');
        if (status.release_url && status.release_url.indexOf('https://') === 0) {
          linkEl.href = status.release_url;
          linkEl.hidden = false;
        } else {
          linkEl.hidden = true;
        }
        banner.hidden = false;
      }

      async function refreshUpdateStatus() {
        try {
          const resp = await fetch('/api/update/status', { headers: { 'Accept': 'application/json' } });
          if (!resp.ok) return;
          renderBanner(await resp.json());
        } catch (e) { /* update check is best-effort */ }
      }

      dismissBtn.addEventListener('click', async function () {
        if (!currentTag) return;
        try {
          const resp = await fetch('/api/update/dismiss', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken() },
            body: JSON.stringify({ tag: currentTag }),
          });
          if (resp.ok) banner.hidden = true;
        } catch (e) { /* ignore */ }
      });

      refreshUpdateStatus();
    })();
  </script>
  <script>
    (function () {
      // Mobile navigation drawer: hamburger opens the off-canvas sidebar,
      // overlay click or selecting a page closes it.
      const toggle = document.getElementById('menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (!toggle || !sidebar || !overlay) return;

      function openMenu() {
        sidebar.classList.add('open');
        overlay.hidden = false;
        requestAnimationFrame(function () { overlay.classList.add('show'); });
        toggle.setAttribute('aria-expanded', 'true');
      }
      function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
        overlay.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
      }
      toggle.addEventListener('click', function () {
        if (sidebar.classList.contains('open')) { closeMenu(); } else { openMenu(); }
      });
      overlay.addEventListener('click', closeMenu);
      sidebar.querySelectorAll('a.nav-item').forEach(function (link) {
        link.addEventListener('click', closeMenu);
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && sidebar.classList.contains('open')) closeMenu();
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
