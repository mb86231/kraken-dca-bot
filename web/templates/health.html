{% extends "base.html" %}
{% block title %}System Health — DCA-Bot{% endblock %}
{% block page_title %}System Health{% endblock %}
{% block content %}
<div class="grid grid-3">
  <div class="card stat-card">
    <div class="stat-label">Bot Process</div>
    <div class="stat-value" id="health-bot">—</div>
  </div>
  <div class="card stat-card">
    <div class="stat-label">Exchange API</div>
    <div class="stat-value" id="health-exchange">—</div>
  </div>
  <div class="card stat-card">
    <div class="stat-label">Telegram</div>
    <div class="stat-value" id="health-telegram">—</div>
  </div>
</div>
<div class="card">
  <h2>Details</h2>
  <div id="health-details" class="status-row">Loading…</div>
</div>
{% endblock %}
{% block scripts %}
<script>
  async function loadHealth() {
    const data = await apiGet('/api/health');
    document.getElementById('health-bot').replaceChildren(el('span', `badge ${data.bot_process ? 'ok' : 'error'}`, data.bot_process ? 'Healthy' : 'Down'));
    document.getElementById('health-exchange').replaceChildren(el('span', `badge ${data.exchange_api ? 'ok' : 'warn'}`, data.exchange_api ? 'Connected' : 'Disconnected'));
    document.getElementById('health-telegram').replaceChildren(el('span', `badge ${data.telegram_api ? 'ok' : 'warn'}`, data.telegram_api ? 'Configured' : 'Not configured'));
    const details = document.getElementById('health-details');
    details.innerHTML = '';
    const wrap = document.createElement('div');
    const rows = [
      ['Version', data.version],
      ['Runtime', data.runtime],
      ['Server Time', data.server_time],
      ['Last Price Update', data.last_price_update],
      ['Last Order', data.last_order],
    ];
    for (const [label, value] of rows) {
      const p = document.createElement('p');
      p.appendChild(el('strong', null, label + ':'));
      p.appendChild(document.createTextNode(' ' + (value ?? '—')));
      wrap.appendChild(p);
    }
    details.appendChild(wrap);
  }
  loadHealth();
  setInterval(loadHealth, 10000);
</script>
{% endblock %}
