{% extends "base.html" %}
{% block title %}Alerts — DCA-Bot{% endblock %}
{% block page_title %}Alerts{% endblock %}
{% block content %}
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
    <h2>Active Alerts</h2>
    <button class="btn btn-small btn-secondary" id="ack-all-btn" style="display:none;">Acknowledge All</button>
  </div>
  <div id="alerts-list" class="warning-list">
    <li class="empty">Loading…</li>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  async function loadAlerts() {
    const data = await apiGet('/api/alerts');
    const list = document.getElementById('alerts-list');
    const ackAllBtn = document.getElementById('ack-all-btn');
    list.innerHTML = '';
    if (!data.alerts || data.alerts.length === 0) {
      list.innerHTML = '<li class="empty">No active alerts.</li>';
      ackAllBtn.style.display = 'none';
      return;
    }
    ackAllBtn.style.display = '';
    data.alerts.forEach(a => {
      const li = document.createElement('li');
      li.style.display = 'flex';
      li.style.justifyContent = 'space-between';
      li.style.alignItems = 'center';
      li.style.gap = '0.75rem';
      const text = document.createElement('span');
      text.appendChild(el('strong', null, a.severity));
      text.appendChild(document.createTextNode(' ' + (a.message || '')));
      const btn = el('button', 'btn btn-small btn-secondary ack-btn', 'Ack');
      btn.dataset.id = a.id;
      li.appendChild(text);
      li.appendChild(btn);
      list.appendChild(li);

      // A3: AI explanation — rendered as plain text, clearly labelled.
      if (a.ai_explanation && a.ai_explanation.text) {
        const explLi = document.createElement('li');
        explLi.className = 'alert-explanation';
        explLi.style.flexDirection = 'column';
        explLi.style.alignItems = 'flex-start';
        explLi.style.gap = '0.25rem';
        explLi.style.borderLeft = '2px solid var(--accent, #c97d0a)';
        explLi.style.paddingLeft = '0.75rem';
        const badge = el('span', 'badge warn', 'AI-generated explanation');
        badge.title = 'Generated ' + (a.ai_explanation.generated_at || 'n/a') +
          ' · prompt ' + (a.ai_explanation.prompt_version || 'n/a');
        const body = document.createElement('div');
        body.textContent = a.ai_explanation.text; // plain text, never HTML
        body.style.whiteSpace = 'pre-wrap';
        explLi.appendChild(badge);
        explLi.appendChild(body);
        list.appendChild(explLi);
      }
    });

    document.querySelectorAll('.ack-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        try {
          await apiPost(`/api/alerts/${id}/acknowledge`);
          showToast('Alert acknowledged', 'success');
          loadAlerts();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    });
  }

  document.getElementById('ack-all-btn').addEventListener('click', async () => {
    if (!(await uiConfirm('Acknowledge all active alerts?', { title: 'Acknowledge all alerts', danger: false }))) return;
    try {
      const data = await apiPost('/api/alerts/acknowledge-all');
      showToast(`Acknowledged ${data.acknowledged} alert(s).`, 'success');
      loadAlerts();
      loadStatus();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  loadAlerts();
</script>
{% endblock %}
