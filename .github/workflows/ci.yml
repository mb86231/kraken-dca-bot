name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest tests/ -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Scan for new secrets against baseline
        run: |
          pip install detect-secrets==1.5.0
          cp .secrets.baseline "$RUNNER_TEMP/baseline.before"
          detect-secrets scan --baseline .secrets.baseline --all-files
          python <<'EOF'
          import json, sys, pathlib, traceback
          try:
              before = json.load(open(pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "baseline.before"))["results"]
              after = json.load(open(".secrets.baseline"))["results"]
              def norm(results):
                  return {
                      (f.replace("\\", "/"), e["type"], e["hashed_secret"], e["line_number"])
                      for f, entries in results.items() for e in entries
                  }
              new = norm(after) - norm(before)
              missing = norm(before) - norm(after)
              lines = ["### detect-secrets baseline check", ""]
              if new:
                  lines.append("**New potential secrets:**")
                  lines += [f"- `{item}`" for item in sorted(new)]
              if missing:
                  lines.append("**Baseline entries not re-detected (stale or moved):**")
                  lines += [f"- `{item}`" for item in sorted(missing)]
              if not (new or missing):
                  lines.append("Baseline matches scan — no new secrets.")
              report = "\n".join(lines)
              print(report)
              summary = pathlib.Path(__import__("os").environ.get("GITHUB_STEP_SUMMARY", "/dev/null"))
              with summary.open("a") as fh:
                  fh.write(report + "\n")
              for item in sorted(new):
                  print(f"::error title=New potential secret::{item}")
              sys.exit(1 if new else 0)
          except SystemExit:
              raise
          except Exception:
              msg = "secrets-check crashed:\\n" + traceback.format_exc().replace("\n", "\\n")
              print(f"::error title=secrets-check error::{msg}")
              raise
          EOF

      - name: Check no internal facts leaked into the public tree
        run: |
          if grep -rInE 'example\.com|192\.168\.[13]\.' --exclude-dir=.git .; then
            echo "internal infrastructure facts leaked into the public tree" >&2
            exit 1
          fi
          for p in .gitea compose.staging.yaml .env.staging.example \
                    SHARING_CHECKLIST.md docs/staging-implementation-plan.md; do
            if [ -e "$p" ]; then
              echo "excluded path present in public tree: $p" >&2
              exit 1
            fi
          done
