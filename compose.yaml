name: crypto-agent

services:
  crypto-agent:
    image: ${IMAGE_NAME:?IMAGE_NAME must be set}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: crypto-agent
    hostname: crypto-agent
    env_file:
      - /opt/crypto-agent/config/.env
    environment:
      - TZ=Europe/Zurich
      - APP_ENV=production
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - /opt/crypto-agent/data:/app/data
      - /opt/crypto-agent/backups:/app/backups
      - /opt/crypto-agent/logs:/app/logs
    networks:
      - crypto-agent
    # `always` (not `unless-stopped`): the dashboard's Restart button works by
    # letting the process exit, which the runtime must treat as a restart event.
    # Explicit `podman stop` / `systemctl stop` still keeps the container down.
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1500:1500"
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    stop_signal: SIGTERM
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    # Publish the dashboard port when WEB_UI_ENABLED=true.
    # Use 0.0.0.0:8003:8000 when an existing Nginx/proxy reaches the host IP.
    # Use 127.0.0.1:8003:8000 for local-only / SSH-tunnel access.
    ports:
      - ${WEB_UI_PUBLISH:-0.0.0.0:8003:8000}
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  crypto-agent:
    name: crypto-agent
    driver: bridge
    # The bot needs outbound HTTPS to api.kraken.com. Do not set internal: true
    # unless you provide a separate egress proxy.

