# Example Nginx reverse-proxy configuration for the DCA-Bot dashboard.
# Place this in /etc/nginx/sites-available/ and symlink it from
# /etc/nginx/sites-enabled/, then reload nginx.
#
# Replace:
#   - example.local with your domain
#   - 192.0.2.50 with the IP address of the host running the bot container
#   - 8003 with the host port the container publishes (production default: 8003)
#   - /path/to/ssl with your TLS certificate and key

server {
    listen 443 ssl http2;
    server_name example.local;

    ssl_certificate     /path/to/ssl/example.local.crt;
    ssl_certificate_key /path/to/ssl/example.local.key;

    # Transport-level security headers. The FastAPI application sets CSP,
    # X-Frame-Options, X-Content-Type-Options, Referrer-Policy, and
    # Permissions-Policy; do not duplicate them here to avoid conflicting values.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://192.0.2.50:8003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name example.local;
    return 301 https://$server_name$request_uri;
}
